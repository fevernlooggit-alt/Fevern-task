<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iCRM v2 · Parallel World · 升级版控制台原型</title>
<style>
  :root{
    --bg:#0B0E17; --ink:#0F1420; --ink2:#121828; --hair:#1C2436; --hair2:#232D44;
    --tx:#DCE3F2; --tx2:#8A94AC; --tx3:#566080;
    --acc:#3FD9AE; --warn:#E4B363; --bad:#E4737F; --info:#7BA7E8; --vio:#9D8CFF;
    --mono:"SF Mono","JetBrains Mono",Consolas,"Roboto Mono",monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:"Space Grotesk",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--tx);overflow:hidden;font-size:13px;font-feature-settings:"tnum" 1}
  ::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--hair2);border-radius:4px}

  .frame{display:flex;height:100vh}
  .rail{width:212px;flex-shrink:0;border-right:1px solid var(--hair);display:flex;flex-direction:column;background:var(--ink)}
  .brand{padding:20px 20px 22px;border-bottom:1px solid var(--hair)}
  .brand .t{font-size:14px;font-weight:600}
  .brand .t i{font-style:normal;color:var(--acc)}
  .brand .s{font-size:10px;color:var(--tx3);letter-spacing:2.5px;text-transform:uppercase;margin-top:4px}
  .rnav{padding:12px 10px;flex:1;overflow:auto}
  .rlink{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--tx2);cursor:pointer;font-size:13px;margin-bottom:2px;transition:.15s;user-select:none;border-left:2px solid transparent}
  .rlink:hover{color:var(--tx);background:rgba(255,255,255,.03)}
  .rlink.on{color:var(--tx);background:rgba(63,217,174,.06);border-left-color:var(--acc)}
  .rlink .n{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--warn)}
  .rlink .n.ok{color:var(--acc)}
  .rfoot{padding:14px 16px;border-top:1px solid var(--hair);font-size:11px;color:var(--tx3);line-height:1.7}
  .rfoot .me{display:flex;gap:9px;align-items:center}
  .rfoot .av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--vio));display:flex;align-items:center;justify-content:center;font-weight:700;color:#06120e;font-size:11px;flex-shrink:0}
  .rfoot b{color:var(--tx2);font-weight:500;display:block;font-size:11.5px}
  .rfoot .mail{font-family:var(--mono);font-size:9.5px;word-break:break-all}

  .shell{flex:1;display:flex;flex-direction:column;min-width:0}
  .hd{height:52px;flex-shrink:0;border-bottom:1px solid var(--hair);display:flex;align-items:center;padding:0 20px;gap:14px;background:var(--ink)}
  .hd h1{font-size:14px;font-weight:600}
  .hd .path{font-size:11px;color:var(--tx3);font-family:var(--mono)}
  .hd .right{margin-left:auto;display:flex;gap:14px;font-size:11px;color:var(--tx2);align-items:center}
  .hd .right b{color:var(--acc);font-family:var(--mono)}
  .bell{position:relative;cursor:pointer;padding:6px;border-radius:8px;border:1px solid var(--hair)}
  .bell:hover{border-color:var(--hair2)}
  .bell .bn{position:absolute;top:-4px;right:-4px;background:var(--bad);color:#fff;font-size:9px;font-family:var(--mono);border-radius:8px;padding:0 5px;font-weight:700}
  .body{flex:1;overflow:hidden;display:flex;min-width:0}
  .pg{display:none;flex:1;min-width:0}
  .pg.on{display:flex;animation:in .2s ease}
  @keyframes in{from{opacity:0;transform:translateY(3px)}to{opacity:1}}

  .lbl{font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--tx3);font-weight:600}
  .mono{font-family:var(--mono);font-size:11.5px}
  .panel{background:var(--ink);border:1px solid var(--hair);border-radius:10px}
  .pill{font-family:var(--mono);font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:5px;letter-spacing:.4px;white-space:nowrap}
  .p-new{color:var(--info);border:1px solid rgba(123,167,232,.4)}
  .p-ai{color:var(--acc);border:1px solid rgba(63,217,174,.4)}
  .p-handoff{color:var(--warn);border:1px solid rgba(228,179,99,.5)}
  .p-review{color:var(--vio);border:1px solid rgba(157,140,255,.45)}
  .p-human{color:var(--tx);border:1px solid var(--hair2);background:var(--ink2)}
  .p-done{color:var(--tx2);border:1px solid var(--hair2)}
  .p-closed{color:var(--tx3);border:1px solid var(--hair)}
  .p-urgent{color:var(--bad);border:1px solid rgba(228,115,127,.55);background:rgba(228,115,127,.07)}
  .p-high{color:var(--warn);border:1px solid rgba(228,179,99,.45)}
  .p-vip{color:var(--vio);border:1px solid rgba(157,140,255,.5)}
  .tag{font-size:10px;padding:2px 8px;border-radius:5px;background:var(--ink2);border:1px solid var(--hair);color:var(--tx2);white-space:nowrap}
  .tag.neg{color:var(--bad);border-color:rgba(228,115,127,.35)}
  .tag.pos{color:var(--acc);border-color:rgba(63,217,174,.3)}
  .bt{border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
  .bt-pri{background:var(--acc);color:#06120e}.bt-pri:hover{filter:brightness(1.08)}
  .bt-line{background:transparent;border:1px solid var(--hair2);color:var(--tx2)}.bt-line:hover{color:var(--tx);border-color:var(--tx3)}
  .bt-warn{background:transparent;border:1px solid rgba(228,179,99,.5);color:var(--warn)}
  .bt-vio{background:transparent;border:1px solid rgba(157,140,255,.5);color:var(--vio)}
  .bt:disabled{opacity:.32;cursor:not-allowed}
  .bt.s{padding:5px 10px;font-size:11px}
  .sla{font-family:var(--mono);font-size:10px}
  .sla.ok{color:var(--acc)}.sla.wn{color:var(--warn)}.sla.br{color:var(--bad)}

  /* ===== inbox 3-col ===== */
  .col-q{width:308px;flex-shrink:0;border-right:1px solid var(--hair);display:flex;flex-direction:column;background:var(--ink)}
  .qtools{padding:12px 12px 8px;border-bottom:1px solid var(--hair)}
  .views{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
  .vchip{font-size:10.5px;padding:4px 10px;border-radius:12px;border:1px solid var(--hair);color:var(--tx2);cursor:pointer;user-select:none}
  .vchip.on{color:var(--tx);border-color:var(--acc);background:rgba(63,217,174,.06)}
  .qsearch input{width:100%;background:var(--ink2);border:1px solid var(--hair);border-radius:8px;padding:7px 11px;color:var(--tx);font-size:12px;font-family:inherit;outline:none}
  .qsearch input:focus{border-color:var(--tx3)}
  .qlist{flex:1;overflow:auto}
  .qt{padding:11px 14px;border-bottom:1px solid var(--hair);cursor:pointer;transition:.1s}
  .qt:hover{background:rgba(255,255,255,.02)}
  .qt.sel{background:rgba(63,217,174,.05);border-left:2px solid var(--acc);padding-left:12px}
  .qt .r1{display:flex;align-items:center;gap:7px;margin-bottom:4px}
  .qt .tid{font-family:var(--mono);font-size:10.5px;color:var(--tx3)}
  .qt .subj{font-size:12.5px;font-weight:600;line-height:1.45;margin-bottom:5px}
  .qt .r3{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--tx3);flex-wrap:wrap}
  .qt .lock{color:var(--bad)}
  .qmore{padding:10px;text-align:center;font-size:11px;color:var(--tx3);cursor:pointer}
  .qmore:hover{color:var(--tx2)}

  .col-c{flex:1;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--hair)}
  .chd{padding:12px 18px;border-bottom:1px solid var(--hair);background:var(--ink)}
  .chd .r1{display:flex;align-items:center;gap:10px}
  .chd h2{font-size:14px;font-weight:600}
  .life{display:flex;gap:5px;align-items:center;margin-top:8px;font-size:9.5px;font-family:var(--mono);color:var(--tx3)}
  .life span.st{padding:2px 8px;border-radius:4px;border:1px solid var(--hair)}
  .life span.st.done{color:var(--acc);border-color:rgba(63,217,174,.35)}
  .life span.st.cur{color:var(--tx);border-color:var(--tx3);background:var(--ink2)}
  .msgs{flex:1;overflow:auto;padding:18px 20px}
  .m{max-width:78%;margin-bottom:14px;line-height:1.65}
  .m .who{font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--tx3);margin-bottom:4px;font-weight:600;display:flex;gap:8px;align-items:center}
  .m .bb{padding:10px 14px;border-radius:4px 12px 12px 12px;background:var(--ink2);border:1px solid var(--hair);font-size:12.5px}
  .m.out{margin-left:auto}
  .m.out .who{justify-content:flex-end}
  .m.out .bb{border-radius:12px 4px 12px 12px;background:rgba(63,217,174,.07);border-color:rgba(63,217,174,.22)}
  .m.eva .bb{background:rgba(123,167,232,.06);border-color:rgba(123,167,232,.25);border-radius:12px 4px 12px 12px}
  .m.note .bb{background:rgba(228,179,99,.05);border:1px dashed rgba(228,179,99,.45);border-radius:10px}
  .m.sys{max-width:100%;text-align:center}
  .m.sys .bb{background:none;border:none;font-family:var(--mono);font-size:10.5px;color:var(--tx3);padding:0}
  .tick{font-family:var(--mono);font-size:9.5px;color:var(--tx3)}
  .tick.ok{color:var(--acc)}
  .tick.fail{color:var(--bad);cursor:pointer}
  .cite{display:inline-flex;gap:5px;margin-top:7px;flex-wrap:wrap}
  .cite span{font-size:9.5px;font-family:var(--mono);padding:2px 8px;border-radius:5px;border:1px solid rgba(123,167,232,.3);color:var(--info);cursor:pointer}
  .compose{border-top:1px solid var(--hair);background:var(--ink);padding:11px 16px}
  .cmodes{display:flex;gap:8px;margin-bottom:8px;align-items:center}
  .cmode{font-size:10.5px;padding:3px 11px;border-radius:11px;border:1px solid var(--hair);color:var(--tx2);cursor:pointer}
  .cmode.on{color:var(--acc);border-color:rgba(63,217,174,.4)}
  .cmode.on.note{color:var(--warn);border-color:rgba(228,179,99,.45)}
  .crow{display:flex;gap:8px}
  .crow textarea{flex:1;background:var(--ink2);border:1px solid var(--hair);border-radius:9px;padding:9px 12px;color:var(--tx);font-size:12.5px;font-family:inherit;outline:none;resize:none;height:60px;line-height:1.5}
  .crow textarea:focus{border-color:var(--tx3)}
  .crow .btcol{display:flex;flex-direction:column;gap:6px}

  .col-x{width:296px;flex-shrink:0;overflow:auto;background:var(--ink);padding:16px}
  .xsec{margin-bottom:18px}
  .xsec .lbl{display:block;margin-bottom:8px}
  .xcard{border:1px solid var(--hair);border-radius:9px;padding:11px 13px;font-size:12px}
  .xcust{display:flex;gap:11px;align-items:center;margin-bottom:10px}
  .xcust .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--vio),var(--info));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
  .xcust b{font-size:13px}
  .xcust .sub{font-size:10px;color:var(--tx3);font-family:var(--mono)}
  .kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--hair);font-size:11.5px}
  .kv:last-child{border:none}
  .kv .k{color:var(--tx3)}
  .kv .v{font-family:var(--mono);color:var(--tx2)}
  .kv .v.hot{color:var(--warn)}
  .aisum{font-size:11.5px;color:var(--tx2);line-height:1.7;border-left:2px solid var(--info);padding:2px 0 2px 11px}
  .aisum .ts{font-size:9px;color:var(--tx3);font-family:var(--mono);display:block;margin-top:5px}
  .hist{font-size:11px;padding:7px 0;border-bottom:1px dashed var(--hair);cursor:pointer;color:var(--tx2)}
  .hist:hover{color:var(--tx)}
  .hist .hm{font-family:var(--mono);font-size:9.5px;color:var(--tx3)}
  .nba{border:1px solid var(--hair);border-radius:8px;padding:9px 11px;margin-bottom:7px;font-size:11.5px;display:flex;align-items:center;gap:9px}
  .nba .txt{flex:1;color:var(--tx2)}
  .nba .bt{flex-shrink:0}

  /* ===== generic page ===== */
  .full{flex:1;overflow:auto;padding:20px 22px;min-width:0}
  .grid{display:grid;gap:14px}
  .g4{grid-template-columns:repeat(4,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:1fr 1fr}
  @media(max-width:1200px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr}}
  .stat{padding:15px 17px}
  .stat .n{font-size:26px;font-weight:700;font-family:var(--mono);margin:2px 0}
  .stat .n.acc{color:var(--acc)}.stat .n.warn{color:var(--warn)}.stat .n.bad{color:var(--bad)}.stat .n.vio{color:var(--vio)}
  .stat .d{font-size:10.5px;color:var(--tx3)}
  table.x{width:100%;border-collapse:collapse;font-size:12.5px}
  table.x th{text-align:left;padding:9px 13px;border-bottom:1px solid var(--hair2);font-size:9.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--tx3);font-weight:600;white-space:nowrap}
  table.x td{padding:10px 13px;border-bottom:1px solid var(--hair);vertical-align:middle}
  table.x tr:last-child td{border:none}
  table.x tr.rw{cursor:pointer}
  table.x tr.rw:hover{background:rgba(255,255,255,.02)}
  .sec{margin-bottom:20px}
  .sec-hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .sec-hd .lbl{font-size:10px}
  .alertcard{border:1px solid rgba(228,115,127,.4);border-left:3px solid var(--bad);border-radius:9px;padding:12px 15px;background:rgba(228,115,127,.04);font-size:12px;line-height:1.7}
  .okcard{border:1px solid rgba(63,217,174,.3);border-left:3px solid var(--acc);border-radius:9px;padding:12px 15px;background:rgba(63,217,174,.04);font-size:12px;line-height:1.7}
  .hbar{display:flex;align-items:center;gap:9px;font-size:11.5px;padding:6px 0;border-bottom:1px dashed var(--hair)}
  .hbar:last-child{border:none}
  .hbar .hk{width:110px;color:var(--tx2);flex-shrink:0}
  .hbar .tr{flex:1;height:5px;background:var(--hair2);border-radius:3px;overflow:hidden}
  .hbar .tr i{display:block;height:100%;border-radius:3px;background:var(--acc)}
  .hbar .hv{font-family:var(--mono);font-size:10px;color:var(--tx2);width:76px;text-align:right}
  .health{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-family:var(--mono)}
  .dot{width:6px;height:6px;border-radius:50%;display:inline-block}
  .d-ok{background:var(--acc)}.d-warn{background:var(--warn)}.d-bad{background:var(--bad)}.d-mut{background:var(--tx3)}
  .stabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .stab{font-size:11.5px;padding:6px 14px;border-radius:8px;border:1px solid var(--hair);color:var(--tx2);cursor:pointer}
  .stab.on{color:var(--tx);border-color:var(--acc);background:rgba(63,217,174,.06)}
  .spg{display:none}.spg.on{display:block;animation:in .2s}
  .switch{position:relative;width:34px;height:18px;flex-shrink:0;cursor:pointer}
  .switch input{opacity:0;width:0;height:0}
  .switch .sl{position:absolute;inset:0;background:var(--hair2);border-radius:10px;transition:.2s}
  .switch .sl:before{content:"";position:absolute;width:12px;height:12px;left:3px;top:3px;background:var(--tx2);border-radius:50%;transition:.2s}
  .switch input:checked + .sl{background:rgba(63,217,174,.35)}
  .switch input:checked + .sl:before{transform:translateX(16px);background:var(--acc)}

  /* modal + toast */
  .scrim{position:fixed;inset:0;background:rgba(5,8,14,.62);z-index:40;display:none;align-items:center;justify-content:center}
  .scrim.show{display:flex}
  .modal{width:480px;max-width:92vw;background:var(--ink);border:1px solid var(--hair2);border-radius:12px;padding:22px;box-shadow:0 24px 80px rgba(0,0,0,.6);max-height:86vh;overflow:auto}
  .modal h3{font-size:14px;margin-bottom:5px}
  .modal .msub{font-size:11.5px;color:var(--tx2);line-height:1.65;margin-bottom:13px}
  .modal textarea,.modal input[type=text]{width:100%;background:var(--ink2);border:1px solid var(--hair);border-radius:8px;padding:10px 12px;color:var(--tx);font-size:12.5px;font-family:inherit;outline:none;line-height:1.6}
  .modal textarea{min-height:80px;resize:vertical}
  .mft{display:flex;gap:8px;justify-content:flex-end;margin-top:15px}
  .wstep{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--hair);font-size:12px;align-items:flex-start}
  .wstep:last-child{border:none}
  .wstep .wn{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--hair2);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9.5px;color:var(--tx3);flex-shrink:0}
  .wstep.done .wn{border-color:var(--acc);color:var(--acc)}
  .note{position:fixed;bottom:18px;right:20px;background:var(--ink);border:1px solid var(--hair2);border-left:2px solid var(--acc);border-radius:9px;padding:12px 16px;font-size:12px;display:none;z-index:50;max-width:400px;box-shadow:0 12px 40px rgba(0,0,0,.5);line-height:1.6}
  .note.show{display:block;animation:in .2s}
  .note.push{border-left-color:var(--warn)}
  @media(max-width:1100px){.col-x{display:none}}
</style>
</head>
<body>
<div class="frame">

  <aside class="rail">
    <div class="brand"><div class="t">iCRM <i>v2</i> · 极光幻影</div><div class="s">Parallel World Ops</div></div>
    <nav class="rnav">
      <div class="rlink on" data-pg="inbox" onclick="nav('inbox')">收件箱 <span class="n" id="nInbox">4</span></div>
      <div class="rlink" data-pg="cust" onclick="nav('cust')">客户 360°</div>
      <div class="rlink" data-pg="review" onclick="nav('review')">审核队列 <span class="n" id="nRev">2</span></div>
      <div class="rlink" data-pg="kb" onclick="nav('kb')">知识库 <span class="n ok" id="nKb">3 缺口</span></div>
      <div class="rlink" data-pg="mon" onclick="nav('mon')">主管驾驶舱</div>
      <div class="rlink" data-pg="set" onclick="nav('set')">设置</div>
    </nav>
    <div class="rfoot">
      <div class="me">
        <div class="av">PW</div>
        <div><b>Parallel World 管理员</b><span class="mail">crm@parallelworldgame.com</span></div>
      </div>
    </div>
  </aside>

  <div class="shell">
    <div class="hd">
      <h1 id="hdT">收件箱</h1>
      <span class="path" id="hdP">/inbox</span>
      <div class="right">
        <span>今日 <b>32</b> 单</span><span>AI 自主解决 <b>61%</b></span><span>SLA 风险 <b style="color:var(--warn)">2</b></span>
        <div class="bell" onclick="say('通知中心：新转人工 1 · SLA 临期 2 · 审批待办 2（原型演示）','push')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="bn" id="bellN">5</span>
        </div>
      </div>
    </div>

    <div class="body">

      <!-- ================= INBOX ================= -->
      <div class="pg on" id="pg-inbox">
        <div class="col-q">
          <div class="qtools">
            <div class="views" id="views"></div>
            <div class="qsearch"><input placeholder="搜索：主题 / 消息内容 / 客户 / #工单号" id="qSearch" oninput="renderQ()"></div>
          </div>
          <div class="qlist" id="qList"></div>
        </div>
        <div class="col-c" id="colC"></div>
        <div class="col-x" id="colX"></div>
      </div>

      <!-- ================= CUSTOMERS ================= -->
      <div class="pg" id="pg-cust"><div class="full" id="custFull"></div></div>

      <!-- ================= REVIEW ================= -->
      <div class="pg" id="pg-review"><div class="full" id="revFull"></div></div>

      <!-- ================= KB ================= -->
      <div class="pg" id="pg-kb"><div class="full" id="kbFull"></div></div>

      <!-- ================= MONITOR ================= -->
      <div class="pg" id="pg-mon"><div class="full" id="monFull"></div></div>

      <!-- ================= SETTINGS ================= -->
      <div class="pg" id="pg-set"><div class="full" id="setFull"></div></div>

    </div>
  </div>
</div>

<div class="scrim" id="scrim"><div class="modal" id="modalBox"></div></div>
<div class="note" id="note"></div>

<script>

function tList(){
  const q=($('qSearch')?.value||'').trim().toLowerCase();
  let l=TICKETS.filter(t=>{
    if(VIEW==='closed')return t.st==='done'||t.st==='closed';
    if(VIEW==='review')return t.st==='review';
    if(VIEW==='sla')return t.sla!==null&&t.sla<=t.slaT*0.5&&t.st!=='done';
    if(VIEW==='vip')return CUSTOMERS[t.cust].vip&&t.st!=='done'&&t.st!=='closed';
    if(VIEW==='mine')return t.lock==='me';
    return t.st!=='done'&&t.st!=='closed';
  });
  if(q)l=l.filter(t=>t.subj.toLowerCase().includes(q)||t.id.includes(q)||CUSTOMERS[t.cust].name.toLowerCase().includes(q)||t.msgs.some(m=>m.t.toLowerCase().includes(q)));
  const rank={urgent:0,high:1,normal:2};
  return l.sort((a,b)=>(a.sla===null?999:a.sla)-(b.sla===null?999:b.sla)||rank[a.pr]-rank[b.pr]);

  const dv=m.dv?`<span class="tick ${m.dv==='ok'?'ok':m.dv==='fail'?'fail':''}" ${m.dv==='fail'?`onclick="say('已重新投递 ✓（出站队列自动重试 3 次后可手动重发）')"`:''}>${m.dv==='ok'?'✓✓ 已送达':m.dv==='fail'?'✗ 投递失败 · 点击重试':'✓ 投递中'}</span>`:'';

}

function claim(){

  say('已接管。协作锁已生效：其他客服打开此单会看到冲突横幅、输入禁用。');renderQ();renderC();
}
function resolve(){
  const t=TICKETS.find(x=>x.id===SEL);t.st='done';t.lock=null;t.sla=null;
  t.msgs.push({r:'sys',t:'已标记解决 · CSAT 回访已通过原渠道发送给客户 · 7 天无回复自动关闭',ts:now()});
  say('已解决。CSAT 回访已自动发出；锁已释放。');renderQ();renderC();
}
function send(){
  const d=$('draft').value.trim();if(!d)return say('内容为空');
  const t=TICKETS.find(x=>x.id===SEL);
  if(CMODE==='note'){t.msgs.push({r:'note',t:d,ts:now()});say('内部备注已保存（客户不可见）。');}
  else{
    if(t.st==='handoff'){t.st='human';t.lock='me';t.msgs.push({r:'sys',t:'回复即接管：状态 → 人工处理，协作锁生效',ts:now()});}
    const m={r:'out',t:d,ts:now(),dv:'pend'};t.msgs.push(m);
    setTimeout(()=>{m.dv='ok';renderC();},900);
    say('已发送 → 出站投递队列（'+t.ch+'）。送达状态实时回写。');
  }
  renderQ();renderC();
}

});
